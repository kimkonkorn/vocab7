<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Master App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Mode Switcher Tabs */
    .mode-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #4f46e5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      color: #1e293b;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .progress {
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #ffffff;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
    }

    .stat-learned { color: #16a34a; }
    .stat-review { color: #dc2626; }

    .voice-selector {
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
    }

    .voice-selector select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      font-size: 13px;
    }

    /* Flashcard Mode Styles */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 300px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border-radius: 20px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }

    .card-front {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    }

    .level-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
    }

    .word-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .word {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
    }

    .btn-audio {
      background: #e0e7ff;
      border: none;
      color: #4338ca;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .pos {
      font-size: 14px;
      color: #6366f1;
      font-style: italic;
      font-weight: 600;
    }

    .hint {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      color: #94a3b8;
    }

    .card-back {
      background: #4f46e5;
      color: #ffffff;
      transform: rotateY(180deg);
      text-align: center;
    }

    .meaning {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .synonyms {
      font-size: 13px;
      color: #c7d2fe;
      margin-bottom: 15px;
    }

    .example {
      font-size: 13px;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 8px;
      font-style: italic;
    }

    /* Memory Rating Buttons */
    .memory-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-review {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .btn-know {
      background-color: #dcfce7;
      color: #166534;
    }

    /* General Nav Controls */
    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-prev, .btn-next {
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-random {
      background-color: #6366f1;
      color: #ffffff;
    }

    /* Game Mode Styles */
    #game-mode {
      display: none;
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }

    .quiz-word-box {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .quiz-word {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      color: #334155;
      padding: 12px;
      text-align: left;
      border-radius: 10px;
      font-size: 15px;
    }

    .option-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .option-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
    }

    .option-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .quiz-score {
      font-size: 16px;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Mode Selector Tabs -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-flashcard" onclick="switchMode('flashcard')">🎴 Flashcard</button>
      <button class="tab-btn" id="tab-quiz" onclick="switchMode('quiz')">🎮 เกมทายคำศัพท์</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="flashcard-mode">
      <div class="header">
        <div class="progress" id="progress">1 / 10</div>
        
        <!-- Voice Dropdown -->
        <div class="voice-selector">
          <label for="accent-select">สำเนียงเสียง: </label>
          <select id="accent-select">
            <option value="en-US">🇺🇸 English (US)</option>
            <option value="en-GB">🇬🇧 English (UK)</option>
          </select>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
          <span class="stat-learned" id="stat-learned">จำได้แล้ว: 0</span>
          <span class="stat-review" id="stat-review">ต้องทบทวน: 0</span>
        </div>
      </div>

      <!-- Flashcard Element -->
      <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="level-badge" id="card-level">A2</span>
            <div class="word-wrapper">
              <div class="word" id="card-word">Garden</div>
              <button class="btn-audio" onclick="speakCurrentWord(event)">🔊</button>
            </div>
            <div class="pos" id="card-pos">Noun</div>
            <div class="hint">แตะการ์ดเพื่อเปิดดูคำแปล ↺</div>
          </div>

          <div class="card-face card-back">
            <div class="meaning" id="card-meaning">สวน</div>
            <div class="synonyms" id="card-synonyms">Synonyms: yard, lawn</div>
            <div class="example" id="card-example">"They spent the afternoon working in the garden."</div>
          </div>
        </div>
      </div>

      <!-- Memory Rating Controls -->
      <div class="memory-controls">
        <button class="btn-review" onclick="markMemory(false)">❌ ยังจำไม่ได้</button>
        <button class="btn-know" onclick="markMemory(true)">มั่งใจ! จำได้แล้ว  YES!</button>
      </div>

      <!-- Nav Controls -->
      <div class="controls">
        <button class="btn-prev" onclick="prevCard()">◄ ก่อนหน้า</button>
        <button class="btn-random" onclick="randomCard()">🎲 สุ่ม</button>
        <button class="btn-next" onclick="nextCard()">ถัดไป ►</button>
      </div>
    </div>

    <!-- QUIZ GAME MODE -->
    <div id="game-mode">
      <div class="quiz-score" id="quiz-score">คะแนน: 0 / 0</div>
      
      <div class="quiz-word-box">
        <div class="quiz-word" id="quiz-word">Garden</div>
        <button class="btn-audio" onclick="speakQuizWord()">🔊</button>
      </div>

      <div class="options-grid" id="options-container">
        <!-- 4 Multiple Choice Options Generated dynamically -->
      </div>

      <button class="btn-random" id="next-quiz-btn" style="display:none;" onclick="loadNextQuiz()">ข้อถัดไป ►</button>
    </div>

  </div>

// ตัวแปรควบคุมระบบ
    let currentIndex = 0;
    let learnedCount = 0;
    let reviewCount = 0;

    // 1. ฟังก์ชันพลิกการ์ด
    function flipCard() {
      const card = document.getElementById("card");
      if (card) {
        card.classList.toggle("flipped");
      }
    }

    // 2. ฟังก์ชันออกเสียงคำศัพท์
    function speakCurrentWord(event) {
      if (event) event.stopPropagation();
      const currentWord = vocabularyDB[currentIndex].word;
      const accent = document.getElementById("accent-select").value;
      const utterance = new SpeechSynthesisUtterance(currentWord);
      utterance.lang = accent;
      window.speechSynthesis.speak(utterance);
    }

    // 3. ฟังก์ชันเปลี่ยนคำศัพท์ถัดไป
    function nextCard() {
      if (currentIndex < vocabularyDB.length - 1) {
        currentIndex++;
        updateCardUI();
      }
    }

    // 4. ฟังก์ชันย้อนกลับคำศัพท์
    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCardUI();
      }
    }

    // 5. ฟังก์ชันสุ่มคำศัพท์
    function randomCard() {
      currentIndex = Math.floor(Math.random() * vocabularyDB.length);
      updateCardUI();
    }

    // 6. ฟังก์ชันบันทึกสถานะจำได้/ต้องทบทวน
    function markMemory(isKnown) {
      if (isKnown) {
        learnedCount++;
        document.getElementById("stat-learned").innerText = "จำได้แล้ว: " + learnedCount;
      } else {
        reviewCount++;
        document.getElementById("stat-review").innerText = "ต้องทบทวน: " + reviewCount;
      }
      nextCard();
    }

    // 7. ฟังก์ชันอัปเดตข้อมูลบนหน้าการ์ด
    function updateCardUI() {
      const data = vocabularyDB[currentIndex];
      document.getElementById("card-word").innerText = data.word;
      document.getElementById("card-pos").innerText = data.pos;
      document.getElementById("card-meaning").innerText = data.meaning;
      document.getElementById("card-synonyms").innerText = "Synonyms: " + data.synonyms;
      document.getElementById("card-example").innerText = '"' + data.example + '"';
      document.getElementById("card-level").innerText = data.level;
      document.getElementById("progress").innerText = (currentIndex + 1) + " / " + vocabularyDB.length;
      
      const card = document.getElementById("card");
      if (card && card.classList.contains("flipped")) {
        card.classList.remove("flipped");
      }
    }

    // โหลดข้อมูลคำศัพท์แรกเมื่อเริ่มเปิดหน้าเว็บ
    updateCardUI();
